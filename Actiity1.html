<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Colour Card</title>
    <style>
      * {
        font-size: 16px;
      }
      body {
        background-color: lightgray;
        align-content: center;
      }
      h1 {
        color: darkblue;
      }
      h2 {
        color: purple;
      }
      p {
        color: dimgray;
      }
      .my-detail {
        color: darkgreen;
        font-weight: bold;
      }
      #my-card {
        background-color: lightcyan;
      }
    </style>
  </head>
  <body>
    <h1>My Colour Card</h1>
    <p style="color: crimson; background-color: rgb(52, 223, 100)">
      Hi! This is my very own webpage.
    </p>
    <div id="my-card">
      <h2>About me</h2>
      <p class="my-detail">My name is Sam</p>
      <p class="my-detail">My favourite color is red.</p>
      <p class="my-detail">My favourite subject is Maths.</p>
      <p class="my-detail">My favourite food is Pasta.</p>
    </div>
    <h2>My favourite things</h2>
    <p>My favourite animal is Cat.</p>
    <p>My favourite sport is cricket.</p>
    <p>My favourite movie is The Lion King.</p>
  </body>
</html>
